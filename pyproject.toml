[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x3dray"
version = "0.3.0.dev1"
description = "Evidence-linked repository analysis with X3D output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
x3dray = "x3dray.__main__:main"

[tool.setuptools.packages.find]
include = ["x3dray*"]

[tool.setuptools.package-data]
x3dray = ["web/*", "lab_web/*", "proof_web/*"]

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
