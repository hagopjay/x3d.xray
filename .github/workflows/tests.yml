name: Core and protocol regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: node --check x3dray/web/tools.js && node --check x3dray/web/mcp.mjs && node --check x3dray/lab_web/lab.js
      - run: python -m x3dray lab --out /tmp/x3dray-bridge-lab
      - run: npm install --prefix /tmp/lab-dom-tests --no-audit --no-fund jsdom@31.0.0
      - run: NODE_PATH=/tmp/lab-dom-tests/node_modules node experiments/test_lab_dom.cjs /tmp/x3dray-bridge-lab/index.html
